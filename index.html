<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>liveboot</title>
  <meta name="description" content="Fake pongoOS / verbose boot screen. One run of about 45 seconds, no loops.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="liveboot">
  <meta name="theme-color" content="#000000">
  <meta name="format-detection" content="telephone=no">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="screen" class="pongo"><div id="console"></div></div>
  <canvas id="logo" aria-hidden="true" hidden></canvas>

  <div id="apple" hidden>
    <svg id="applelogo" viewBox="0 0 24 24" aria-hidden="true"><path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.039 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/></svg>
    <div id="track"><div id="bar"></div></div>
  </div>

  <div id="hint" hidden>tap to run again</div>

  <div id="install" hidden>
    <div class="card">
      <h1>liveboot</h1>
      <p>This only runs as a Home Screen app.</p>
      <ol>
        <li><b>1.</b> Open this page in Safari</li>
        <li><b>2.</b> Tap <b>Share</b></li>
        <li><b>3.</b> Tap <b>Add to Home Screen</b></li>
        <li><b>4.</b> Launch it from the new icon</li>
      </ol>
    </div>
  </div>

  <script src="logo.js"></script>
  <script src="app.js"></script>
</body>
</html>
